<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting | Latooka UI</title>
  <script>
    const base = '/public'
    const route = location.pathname.startsWith(base)
      ? location.pathname.slice(base.length) + location.search + location.hash
      : location.pathname + location.search + location.hash
    sessionStorage.setItem('gh-pages-route', route || '/')
    location.replace(`${base}/`)
  </script>
</head>

<body></body>

</html>
